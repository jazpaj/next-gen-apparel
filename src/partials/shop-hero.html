    <section class="shop-hero" id="shop-hero" aria-labelledby="shop-hero-title">
      <svg class="shop-hero__defs" width="0" height="0" aria-hidden="true" focusable="false">
        <filter id="shop-hero-rough" x="-5%" y="-40%" width="110%" height="180%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
        </filter>
      </svg>

      <div class="shop-hero__banner">
        <figure class="shop-hero__media">
          <img class="shop-hero__img" src="assets/img/hero-model.webp" width="864" height="480" fetchpriority="high" decoding="async"
               alt="Model in a black technical jacket looking down at the camera, framed by an orange panel and a concrete pillar">
        </figure>

        <div class="shop-hero__content container">
          <nav class="shop-hero__crumbs" aria-label="Breadcrumb">
            <ol class="shop-hero__crumb-list">
              <li><a class="shop-hero__crumb-home" href="index.html" aria-label="Home">/</a></li>
              <li><span aria-current="page">Shop</span></li>
            </ol>
          </nav>

          <h1 class="shop-hero__title" id="shop-hero-title">
            <span class="shop-hero__line">Shop</span>
            <span class="shop-hero__line shop-hero__line--2">The Drop</span>
            <svg class="shop-hero__swoosh" viewBox="0 0 350 52" preserveAspectRatio="none" aria-hidden="true" focusable="false">

            </svg>
          </h1>

          <p class="shop-hero__sub">Latest releases, core essentials,<br> and limited drops.</p>
        </div>
      </div>
