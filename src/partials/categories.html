    <section class="categories" aria-labelledby="categories-title">
      <h2 id="categories-title" class="visually-hidden">Shop by category</h2>
      <span class="categories__mark categories__mark--left" aria-hidden="true"></span>
      <span class="categories__mark categories__mark--right" aria-hidden="true"></span>
      <ul class="categories__track" role="list">
        <li class="categories__item reveal">
          <a class="cat-card cat-card--light" href="shop.html?sort=newest">
            <img class="cat-card__img cat-card__img--new" src="assets/img/new-arrivals.webp" width="501" height="283" alt="" loading="lazy" decoding="async">
            <span class="cat-card__label">New<br>Arrivals</span>
            <svg class="cat-card__arrow" viewBox="0 0 40 12" aria-hidden="true"><path d="M0 6h38M33 1l5 5-5 5"/></svg>
          </a>
        </li>
        <li class="categories__item reveal" style="transition-delay:100ms">
          <a class="cat-card cat-card--dark" href="collections.html">
            <img class="cat-card__img cat-card__img--col" src="assets/img/collection-strap.webp" width="485" height="282" alt="" loading="lazy" decoding="async">
            <span class="cat-card__label">Collections</span>
            <svg class="cat-card__arrow" viewBox="0 0 40 12" aria-hidden="true"><path d="M0 6h38M33 1l5 5-5 5"/></svg>
          </a>
        </li>
        <li class="categories__item reveal" style="transition-delay:200ms">
          <a class="cat-card cat-card--light cat-card--best cat-card--hover-arrow" href="shop.html?sort=popular">
            <img class="cat-card__img cat-card__img--best" src="assets/img/best-sellers.webp" width="495" height="282" alt="" loading="lazy" decoding="async">
            <span class="cat-card__label">Best<br>Sellers</span>
            <svg class="cat-card__arrow" viewBox="0 0 40 12" aria-hidden="true"><path d="M0 6h38M33 1l5 5-5 5"/></svg>
          </a>
        </li>
      </ul>
    </section>
